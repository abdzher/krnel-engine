---
# =============================================================================
# KRNEL — inventories/mrkov/group_vars/all.yml.example
# Variables globales del clúster MRKOV.
#
# IMPORTANTE — Variables sensibles (marcadas con [VAULT]):
#   Cifrar con: ansible-vault encrypt_string '<valor>' --name '<variable>'
#   Ejecutar playbooks con: ansible-playbook ... --ask-vault-pass
# =============================================================================

# -----------------------------------------------------------------------------
# Red
# -----------------------------------------------------------------------------
network_segment:   "X.X.X.0/24"
k3s_cluster_cidr:  "172.20.0.0/16"   # CIDR de Pods  — evita colisión con red 10.x
k3s_service_cidr:  "172.21.0.0/16"   # CIDR de Services

# IPs individuales (referenciadas en plantillas y reglas de firewall)
nd1_ip: "X.X.X.1"
nd2_ip: "X.X.X.2"
nd3_ip: "X.X.X.3"
nd4_ip: "X.X.X.4"

# Mapa de nodos: usado por /etc/hosts y reglas UFW
cluster_nodes:
  - { name: "nd-1", ip: "{{ nd1_ip }}" }
  - { name: "nd-2", ip: "{{ nd2_ip }}" }
  - { name: "nd-3", ip: "{{ nd3_ip }}" }
  - { name: "nd-4", ip: "{{ nd4_ip }}" }

# -----------------------------------------------------------------------------
# Versiones de software — fijar siempre versiones para reproducibilidad
# -----------------------------------------------------------------------------
k3s_version:          "v1.35.3+k3s1"
helm_version:         "3.17.3"
cert_manager_version: "v1.20.2"
jupyterhub_version:   "4.2.0"
longhorn_version:     "1.11.2"

# SHA-256 del tarball de Helm para linux/amd64.
# Obtener en: https://github.com/helm/helm/releases/tag/v{{ helm_version }}
# Formato:    sha256:<hash>
helm_checksum: "sha256:REEMPLAZAR_CON_CHECKSUM_SHA256_DE_helm-v3.17.3-linux-amd64.tar.gz"

# StorageClass por defecto para PVCs dinámicos del clúster.
storage_class_name: "longhorn"

# -----------------------------------------------------------------------------
# Longhorn
# -----------------------------------------------------------------------------
longhorn_release:               "longhorn"
longhorn_namespace:             "longhorn-system"
longhorn_data_path:             "/var/lib/longhorn"
longhorn_default_replica_count: 2
longhorn_domain:                "longhorn.midominio.com"
longhorn_ingress_enabled:       false
longhorn_nodeport_enabled:      false  # deshabilitado (hallazgo E5): el NodePort hace DNAT en la
                                        # tabla nat/PREROUTING, ANTES de que UFW pueda filtrarlo por
                                        # INPUT — la regla "route allow to k3s_cluster_cidr" (necesaria
                                        # para el tráfico normal del clúster) deja pasar ese tráfico
                                        # ya redirigido sin querer. Acceso admin ahora vía
                                        # `kubectl port-forward` sobre el túnel SSH/Tailscale ya
                                        # existente — ver README "Accessing Longhorn Panel".
longhorn_nodeport:              30090
longhorn_ui_allowed_cidrs:
  - "{{ network_segment }}"

# Snapshots recurrentes LOCALES (hallazgo E1 del audit). NO son backup: viven
# en el mismo clúster/discos, así que no protegen contra perder un nodo o un
# disco — solo contra borrado accidental o corrupción de un volumen puntual
# (ej. un corte de energía que deja un archivo a medio escribir). Mientras no
# exista un BackupTarget externo, esta es la única red de seguridad.
longhorn_snapshot_group:        "jupyter-pvcs"
longhorn_snapshot_cron:         "0 3 * * *"   # 03:00, fuera de horario de clase
longhorn_snapshot_retain:       7             # cuántos snapshots guardar por volumen
longhorn_snapshot_concurrency:  2

# PVCs RWX compartidos para JupyterHub sobre Longhorn.
jupyter_shared_clases_pvc:      "jupyter-shared-clases"
jupyter_shared_comunidad_pvc:   "jupyter-shared-comunidad"
jupyter_shared_repositorio_pvc: "jupyter-shared-repositorio"
jupyter_shared_clases_size:     "20Gi"
jupyter_shared_comunidad_size:  "50Gi"
jupyter_shared_repositorio_size: "100Gi"

# Kubeconfig en el nodo master (usado por módulos kubernetes.core)
k8s_kubeconfig: "/home/ansible/.kube/config"

# -----------------------------------------------------------------------------
# VictoriaMetrics
# -----------------------------------------------------------------------------
victoria_metrics_version:   "0.74.1"
victoria_metrics_release:   "mrkovmonitor"
victoria_metrics_namespace: "monitoring"
victoria_metrics_port:      30030
victoria_metrics_retention: "1"   # Número de meses
victoria_metrics_storage:   "5Gi"

# Límites por componente — sin esto, los pods de monitoreo quedan sin acotar
# y compiten por cuota con las sesiones de estudiantes (hallazgo E4 del audit).
# Valores conservadores de partida para un stack de un solo clúster pequeño;
# ajustar si Grafana se siente lento (es el más visible) o si vmalert empieza
# a evaluar muchas más reglas tras activar alertamiento.
victoria_metrics_vmsingle_cpu_request:    "250m"
victoria_metrics_vmsingle_memory_request: "512Mi"
victoria_metrics_vmsingle_cpu_limit:      "1"
victoria_metrics_vmsingle_memory_limit:   "2Gi"

victoria_metrics_grafana_cpu_request:    "100m"
victoria_metrics_grafana_memory_request: "256Mi"
victoria_metrics_grafana_cpu_limit:      "500m"
victoria_metrics_grafana_memory_limit:   "512Mi"

victoria_metrics_vmagent_cpu_request:    "100m"
victoria_metrics_vmagent_memory_request: "256Mi"
victoria_metrics_vmagent_cpu_limit:      "500m"
victoria_metrics_vmagent_memory_limit:   "512Mi"

victoria_metrics_vmalert_cpu_request:    "50m"
victoria_metrics_vmalert_memory_request: "128Mi"
victoria_metrics_vmalert_cpu_limit:      "250m"
victoria_metrics_vmalert_memory_limit:   "256Mi"

victoria_metrics_alertmanager_cpu_request:    "50m"
victoria_metrics_alertmanager_memory_request: "64Mi"
victoria_metrics_alertmanager_cpu_limit:      "200m"
victoria_metrics_alertmanager_memory_limit:   "128Mi"
# Nombre corto a propósito — el chart genera "vmalertmanager-<release>-<chart>"
# para el Alertmanager integrado y eso ya rompe el límite de 63 bytes de
# Kubernetes con este release (ver comentario largo en vm-values.yaml.j2).
# Por eso el Alertmanager real se despliega aparte con este nombre.
victoria_metrics_alertmanager_name: "mrkov-alerts"

# -----------------------------------------------------------------------------
# Alertamiento por correo (hallazgo E3) — [VAULT] smtp_auth_password
# vmalert evalúa las reglas; Alertmanager las agrupa y envía el correo.
# Generar la contraseña de aplicación en myaccount.google.com/apppasswords
# (requiere 2FA en la cuenta remitente) y cifrarla:
#   ansible-vault encrypt_string 'clave-de-16-caracteres' --name smtp_auth_password
# -----------------------------------------------------------------------------
smtp_smarthost:      "smtp.gmail.com:587"
smtp_from:            "alertas@midominio.com"
smtp_auth_username:   "alertas@midominio.com"
smtp_auth_password:  "!vault |
          $ANSIBLE_VAULT...REEMPLAZAR_CON_ANSIBLE_VAULT"
alert_admin_emails:
  - "admin1@midominio.com"
  - "admin2@midominio.com"

# -----------------------------------------------------------------------------
# JupyterHub
# -----------------------------------------------------------------------------
jupyterhub_release:    "hub"
jupyterhub_namespace:  "jupyter"
jupyterhub_domain:     "jupyter.midominio.com"
jupyterhub_port:       50080     # puerto donde se expone el JupyterHub a traves de nodeport
jupyterhub_admin_user: "admin"

# Ruta a la lista blanca de correos autorizados (hallazgo M2). Se calcula UNA
# sola vez aquí con `inventory_dir` (constante para cualquier playbook, a
# diferencia de `playbook_dir`, que cambia según la profundidad del playbook
# que lo invoque — 05-jupyterhub.yml vs. mantenimiento/update-jupyterhub-config.yml
# estaban en carpetas distintas y cada uno recalculaba esta ruta por su cuenta).
allowlist_path: "{{ inventory_dir }}/../../files/allowlist.txt"

# -----------------------------------------------------------------------------
# Portal MRKOV
# -----------------------------------------------------------------------------
mrkov_domain: "mrkov.midominio.com"

# -----------------------------------------------------------------------------
# Spark on Kubernetes
# -----------------------------------------------------------------------------
# Tag fijo de la imagen — verificar disponible en:
# https://quay.io/repository/jupyter/all-spark-notebook?tab=tags
# Formato recomendado: spark-X.Y.Z  (comunica versión de Spark explícitamente)
spark_image_tag: "spark-4.1.1"

# Configuración de los executor pods lanzados al clúster k3s.
# Estos valores son los defaults — usuarios avanzados pueden sobreescribirlos
# en su SparkSession, dentro de los límites impuestos por ResourceQuota.
spark_executor_instances: 2     # Número de executors por job
spark_executor_cores:     1     # CPUs por executor
spark_executor_request_cores: "500m"
spark_executor_limit_cores:   "1"
spark_executor_memory:    "2g"  # RAM por executor
spark_executor_memory_overhead: "512m"

# -----------------------------------------------------------------------------
# ResourceQuota del namespace jupyter
# Limita el consumo total de recursos para prevenir que jobs de Spark
# con muchos executors saturen el clúster completo.
#
# Guía de dimensionamiento (hardware real, ver auditoría Fase 3):
#   4 nodos utilizables (nd-1 también programa cargas, sin node-taint) ×
#   20 CPU lógicas / 16GB RAM cada uno = 80 vCPU / 64GB totales.
#   Con ~75% asignable a `jupyter` (el resto para kube-system, longhorn-system,
#   monitoring, cert-manager, Traefik): ~60 vCPU / ~51GB utilizables.
#   RAM es el recurso más ajustado: se sube con margen conservador, no al
#   máximo, y se vigila con el alertamiento de la Fase 4.
#   `jupyter_quota_pvcs` no está limitado por espacio real: 119 usuarios en el
#   perfil personal más grande (5Gi c/u) + 170Gi de PVCs compartidos ≈ 766Gi,
#   muy por debajo de los ~2TB utilizables con replica_count=2 en Longhorn.
# -----------------------------------------------------------------------------
jupyter_quota_pods:            "30"    # máx pods simultáneos en namespace
jupyter_quota_cpu_requests:    "40"    # suma de cpu requests de todos los pods
jupyter_quota_cpu_limits:      "56"    # suma de cpu limits de todos los pods
jupyter_quota_memory_requests: "40Gi"  # suma de memory requests
jupyter_quota_memory_limits:   "52Gi"  # suma de memory limits
jupyter_quota_pvcs:            "130"   # máx PVCs (119 correos + 4 fijos + margen)

# LimitRange — defaults y topes por pod individual (executor o singleuser)
jupyter_limit_pod_cpu_default_request:    "500m"
jupyter_limit_pod_cpu_default_limit:      "1"
jupyter_limit_pod_cpu_max:                "8"
jupyter_limit_pod_memory_default_request: "512Mi"
jupyter_limit_pod_memory_default_limit:   "2Gi"
jupyter_limit_pod_memory_max:             "12Gi"

# -----------------------------------------------------------------------------
# [VAULT] Credenciales — NUNCA en texto plano en Git
# -----------------------------------------------------------------------------
# Generar proxy_token con: openssl rand -hex 32, copiar resultado 
# (eliminar comillas)
proxy_token:            "!vault |
          $ANSIBLE_VAULT...REEMPLAZAR_CON_ANSIBLE_VAULT"

# -----------------------------------------------------------------------------
# Control de comportamiento de playbooks
# -----------------------------------------------------------------------------
# Activar solo en ventanas de mantenimiento programadas.
# Uso: ansible-playbook ... -e perform_apt_upgrade=true
perform_apt_upgrade: false
