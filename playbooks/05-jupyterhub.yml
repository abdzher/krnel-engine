---
# =============================================================================
# KRNEL — playbooks/05-jupyterhub.yml
# Tarea 8: Despliegue de JupyterHub sobre k3s.
#
# PRE-REQUISITOS antes de ejecutar:
#   1. proxy_token debe estar cifrado en Ansible Vault.
#      ansible-vault encrypt_string "$(openssl rand -hex 32)" --name proxy_token
#   2. Copiar files/allowlist.txt.example a files/allowlist.txt y agregar
#      los correos electrónicos autorizados (uno por línea).
#
# Para ACTUALIZAR JupyterHub (dry-run + despliegue):
#   ansible-playbook playbooks/05-jupyterhub.yml --tags update_dry
#   ansible-playbook playbooks/05-jupyterhub.yml --tags update
# =============================================================================

- name: "TAREA 8 | Desplegar JupyterHub"
  hosts: master
  become: false
  tasks:
    # -------------------------------------------------------------------------
    # Archivos Temporales Seguros
    # -------------------------------------------------------------------------
    - name: Crear archivo temporal para hub-values
      ansible.builtin.tempfile:
        state: file
        suffix: -hub.yaml
      register: tmp_hub_values
      tags: [update, update_dry]

    - name: Crear archivo temporal para spark-rbac
      ansible.builtin.tempfile:
        state: file
        suffix: -rbac.yaml
      register: tmp_spark_rbac
      tags: [update]

    - name: Crear archivo temporal para PVCs compartidos
      ansible.builtin.tempfile:
        state: file
        suffix: -shared-pvcs.yaml
      register: tmp_shared_pvcs
      tags: [update]

    # -------------------------------------------------------------------------
    # Pre-validaciones
    # -------------------------------------------------------------------------
    - name: Verificar que el archivo allowlist.txt existe en files/
      ansible.builtin.stat:
        path: "{{ allowlist_path }}"
      register: allowlist_stat
      delegate_to: localhost
      tags: [update, update_dry]

    - name: Fallar si allowlist.txt no existe
      ansible.builtin.fail:
        msg: >
          No se encontró 'files/allowlist.txt'.
          Copia 'files/allowlist.example.txt' a 'files/allowlist.txt' y
          agrega los correos autorizados (uno por línea).
      when: not allowlist_stat.stat.exists
      tags: [update, update_dry]

    # -------------------------------------------------------------------------
    # M4 — Aviso si la cuota de PVCs no alcanza para toda la allowlist.
    # PVCs fijos: hub-db-dir + 3 compartidos (clases/comunidad/repositorio) = 4.
    # No falla el despliegue (la cuota real ya está dimensionada, hallazgo
    # E7/E8) — solo evita que un futuro crecimiento de la allowlist sin ajustar
    # la cuota se descubra en producción como un PVC en Pending.
    # -------------------------------------------------------------------------
    - name: Contar correos en allowlist.txt
      ansible.builtin.set_fact:
        allowlist_user_count: "{{ lookup('file', allowlist_path).splitlines() | map('trim') | select() | list | length }}"
      delegate_to: localhost
      tags: [update, update_dry]

    - name: Avisar si jupyter_quota_pvcs no alcanza para la allowlist completa
      ansible.builtin.debug:
        msg: >
          jupyter_quota_pvcs ({{ jupyter_quota_pvcs }}) solo deja
          {{ (jupyter_quota_pvcs | int) - 4 }} carpetas personales, pero
          allowlist.txt tiene {{ allowlist_user_count }} correos. Si todos
          piden un perfil con almacenamiento persistente, el cupo no alcanza.
      when: (jupyter_quota_pvcs | int) - 4 < (allowlist_user_count | int)
      tags: [update, update_dry]

    - name: Verificar que proxy_token no es el valor de ejemplo
      ansible.builtin.fail:
        msg: >
          'proxy_token' contiene el valor de ejemplo. Genera y cifra el token real:
          ansible-vault encrypt_string "$(openssl rand -hex 32)" --name proxy_token
      when: proxy_token == "REEMPLAZAR_CON_ANSIBLE_VAULT"
      tags: [update, update_dry]

    # -------------------------------------------------------------------------
    # ResourceQuota y LimitRange — aplicar ANTES de desplegar JupyterHub
    # Garantiza que los limits existen desde el primer pod que se cree.
    # -------------------------------------------------------------------------
    - name: Crear namespace {{ jupyterhub_namespace }} si no existe
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        api_version: v1
        kind: Namespace
        name: "{{ jupyterhub_namespace }}"
        state: present
      tags: [update]

    - name: Renderizar spark-quota.yaml desde plantilla
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/spark-quota.yaml.j2"
        dest: "/tmp/spark-quota-{{ ansible_facts['date_time']['epoch'] }}.yaml"
        mode: "0644"
      register: quota_tmp
      tags: [update]

    - name: Aplicar ResourceQuota y LimitRange al namespace jupyter
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        src: "{{ quota_tmp.dest }}"
      tags: [update]

    - name: Limpiar spark-quota.yaml temporal
      ansible.builtin.file:
        path: "{{ quota_tmp.dest }}"
        state: absent
      tags: [update]

    # -------------------------------------------------------------------------
    # PVC de base de datos del Hub
    # El chart normalmente lo crea, pero declararlo aquí evita que el Deployment
    # quede Pending si el PVC fue borrado o quedó fuera del release.
    # -------------------------------------------------------------------------
    - name: Asegurar PVC sqlite del Hub sobre Longhorn
      # Nota: Ansible NO templatiza claves de diccionario dentro de `definition:`
      # (solo valores) — una clave dinámica como `recurring-job-group.longhorn.io/{{ var }}`
      # llega literal al API de Kubernetes. Por eso la etiqueta de snapshot se arma
      # aparte con `combine()` sobre un dict cuya clave dinámica es un VALOR Jinja2.
      vars:
        _hub_db_pvc_labels:
          app: jupyterhub
          app.kubernetes.io/component: hub
          app.kubernetes.io/instance: "{{ jupyterhub_release }}"
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/name: jupyterhub
          component: hub
          heritage: Helm
          release: "{{ jupyterhub_release }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: hub-db-dir
            namespace: "{{ jupyterhub_namespace }}"
            labels: "{{ _hub_db_pvc_labels | combine({('recurring-job-group.longhorn.io/' ~ longhorn_snapshot_group): 'enabled'}) }}"
            annotations:
              meta.helm.sh/release-name: "{{ jupyterhub_release }}"
              meta.helm.sh/release-namespace: "{{ jupyterhub_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: "{{ storage_class_name }}"
            resources:
              requests:
                storage: 1Gi
      tags: [update]

    # -------------------------------------------------------------------------
    # PVCs compartidos — reemplazo Longhorn RWX para clases/comunidad/repositorio
    # -------------------------------------------------------------------------
    - name: Renderizar PVCs compartidos sobre Longhorn
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/jupyter-shared-pvcs.yaml.j2"
        dest: "{{ tmp_shared_pvcs.path }}"
        mode: "0644"
      tags: [update]

    - name: Aplicar PVCs compartidos de JupyterHub
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        src: "{{ tmp_shared_pvcs.path }}"
      tags: [update]

    - name: Limpiar manifest temporal de PVCs compartidos
      ansible.builtin.file:
        path: "{{ tmp_shared_pvcs.path }}"
        state: absent
      tags: [update]

    # -------------------------------------------------------------------------
    # Snapshot recurrente local (hallazgo E1) — barrida de respaldo
    # Los PVCs estáticos (hub-db-dir, compartidos) ya llevan la etiqueta en su
    # propia definición. Esta tarea la agrega también a los PVCs personales
    # que KubeSpawner crea dinámicamente (incluyendo los que ya existían antes
    # de que esta etiqueta se agregara a `hub-values.yaml.j2`).
    # -------------------------------------------------------------------------
    - name: Incluir PVCs existentes en el grupo de snapshots recurrentes de Longhorn
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ jupyterhub_namespace }}
        label pvc --all recurring-job-group.longhorn.io/{{ longhorn_snapshot_group }}=enabled --overwrite
      register: _pvc_snapshot_label
      changed_when: "'not labeled' not in _pvc_snapshot_label.stdout"
      tags: [update]

    # -------------------------------------------------------------------------
    # Repositorio Helm de JupyterHub
    # -------------------------------------------------------------------------
    - name: Agregar repositorio Helm de JupyterHub
      kubernetes.core.helm_repository:
        kubeconfig: "{{ k8s_kubeconfig }}"
        name: jupyterhub
        repo_url: "https://hub.jupyter.org/helm-chart/"
        state: present
      register: _helm_repo_jupyterhub
      # kubernetes.core.helm_repository (6.5.0) no es idempotente: falla con
      # "Repository already have a repository named X" en vez de no-op cuando
      # el repo ya existe. Se tolera ese mensaje puntual; cualquier otro fallo
      # sigue siendo fatal.
      failed_when:
        - _helm_repo_jupyterhub is failed
        - "'already have a repository' not in (_helm_repo_jupyterhub.msg | default(''))"
      tags: [update, update_dry]

    # -------------------------------------------------------------------------
    # RBAC de Spark
    # -------------------------------------------------------------------------
    - name: Renderizar spark-rbac.yaml desde plantilla
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/spark-rbac.yaml.j2"
        dest: "{{ tmp_spark_rbac.path }}"
        mode: "0644"
      tags: [update]

    - name: Aplicar políticas RBAC de Spark al clúster
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        src: "{{ tmp_spark_rbac.path }}"
      tags: [update]

    - name: Limpiar spark-rbac.yaml temporal
      ansible.builtin.file:
        path: "{{ tmp_spark_rbac.path }}"
        state: absent
      tags: [update]

    # -------------------------------------------------------------------------
    # Despliegue de JupyterHub
    # El allowlist se incrusta en el template hub-values.yaml.j2 directamente,
    # eliminando la necesidad de --set-file (no compatible con kubernetes.core.helm).
    # -------------------------------------------------------------------------
    - name: Renderizar hub-values.yaml desde plantilla Jinja2 (con allowlist embebido)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/hub-values.yaml.j2"
        dest: "{{ tmp_hub_values.path }}"
        mode: "0600"   # Permisos restrictivos: contiene credenciales
      tags: [update, update_dry]

    - name: Instalar/Actualizar JupyterHub (upgrade --install)
      kubernetes.core.helm:
        kubeconfig: "{{ k8s_kubeconfig }}"
        name: "{{ jupyterhub_release }}"
        chart_ref: jupyterhub/jupyterhub
        release_namespace: "{{ jupyterhub_namespace }}"
        create_namespace: true
        chart_version: "{{ jupyterhub_version }}"
        values_files:
          - "{{ tmp_hub_values.path }}"
        update_repo_cache: true
        state: present
      tags: [update]

    - name: Dry-run de actualización de JupyterHub (validar antes de aplicar)
      kubernetes.core.helm:
        kubeconfig: "{{ k8s_kubeconfig }}"
        name: "{{ jupyterhub_release }}"
        chart_ref: jupyterhub/jupyterhub
        release_namespace: "{{ jupyterhub_namespace }}"
        chart_version: "{{ jupyterhub_version }}"
        values_files:
          - "{{ tmp_hub_values.path }}"
        update_repo_cache: false
        state: present
      check_mode: true   # Equivalente a --dry-run
      tags: [update_dry, never]

    - name: Limpiar hub-values.yaml temporal (contiene credenciales)
      ansible.builtin.file:
        path: "{{ tmp_hub_values.path }}"
        state: absent
      tags: [update, update_dry]

    # -------------------------------------------------------------------------
    # Verificación
    # -------------------------------------------------------------------------
    - name: Verificar disponibilidad del Hub
      tags: [update]
      block:
        - name: Esperar a que el Hub esté disponible
          kubernetes.core.k8s_info:
            kubeconfig: "{{ k8s_kubeconfig }}"
            kind: Deployment
            namespace: "{{ jupyterhub_namespace }}"
            name: hub
            wait: true
            wait_condition:
              type: Available
              status: "True"
            wait_timeout: 200
          register: hub_status

      rescue:
        - name: Diagnóstico | Pods de JupyterHub
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ jupyterhub_namespace }}
            get pods -o wide
          register: jupyterhub_get_pods
          changed_when: false
          failed_when: false

        - name: Diagnóstico | PVCs de JupyterHub
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ jupyterhub_namespace }}
            get pvc -o wide
          register: jupyterhub_get_pvcs
          changed_when: false
          failed_when: false

        - name: Diagnóstico | Descripción de pods
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ jupyterhub_namespace }}
            describe pods
          register: jupyterhub_describe_pods
          changed_when: false
          failed_when: false

        - name: Diagnóstico | Eventos recientes
          ansible.builtin.command: >-
            kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ jupyterhub_namespace }}
            get events --sort-by=.metadata.creationTimestamp
          register: jupyterhub_get_events
          changed_when: false
          failed_when: false

        - name: Mostrar diagnóstico de fallo de JupyterHub
          ansible.builtin.debug:
            msg:
              pods: "{{ jupyterhub_get_pods.stdout_lines | default([]) }}"
              pvcs: "{{ jupyterhub_get_pvcs.stdout_lines | default([]) }}"
              pod_details: "{{ jupyterhub_describe_pods.stdout_lines | default([]) }}"
              events: "{{ jupyterhub_get_events.stdout_lines | default([]) }}"

        - name: Fallar si el Hub no quedó disponible
          ansible.builtin.fail:
            msg: >
              JupyterHub no quedó disponible dentro del timeout. Revisa los pods
              y eventos mostrados arriba en el namespace '{{ jupyterhub_namespace }}'.

    # -------------------------------------------------------------------------
    # Fase 8 — VMServiceScrape para /hub/metrics (observabilidad de aplicación,
    # no solo de infraestructura genérica). Requiere authenticate_prometheus:
    # false en hub-values.yaml.j2 (ver ese archivo) y el CRD VMServiceScrape,
    # ya instalado por 04-monitoring.yml (corre antes en site.yml).
    # -------------------------------------------------------------------------
    - name: Renderizar VMServiceScrape de JupyterHub desde plantilla Jinja2
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/jupyterhub-vmservicescrape.yaml.j2"
        dest: "/tmp/jupyterhub-vmservicescrape-{{ ansible_facts['date_time']['epoch'] }}.yaml"
        mode: "0644"
      register: jupyterhub_vmservicescrape_tmp
      tags: [update]

    - name: Aplicar VMServiceScrape de JupyterHub al clúster
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        src: "{{ jupyterhub_vmservicescrape_tmp.dest }}"
      tags: [update]

    - name: Limpiar manifest temporal de VMServiceScrape
      ansible.builtin.file:
        path: "{{ jupyterhub_vmservicescrape_tmp.dest }}"
        state: absent
      tags: [update]
      when: jupyterhub_vmservicescrape_tmp.dest is defined

    - name: Renderizar VMRule de alertas de JupyterHub desde plantilla Jinja2
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/jupyterhub-vmrule.yaml.j2"
        dest: "/tmp/jupyterhub-vmrule-{{ ansible_facts['date_time']['epoch'] }}.yaml"
        mode: "0644"
      register: jupyterhub_vmrule_tmp
      tags: [update]

    - name: Aplicar VMRule de alertas de JupyterHub al clúster
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        src: "{{ jupyterhub_vmrule_tmp.dest }}"
      tags: [update]

    - name: Limpiar manifest temporal de VMRule
      ansible.builtin.file:
        path: "{{ jupyterhub_vmrule_tmp.dest }}"
        state: absent
      tags: [update]
      when: jupyterhub_vmrule_tmp.dest is defined

    - name: Confirmar despliegue de JupyterHub
      ansible.builtin.debug:
        msg: >
          JupyterHub '{{ jupyterhub_release }}' v{{ jupyterhub_version }} desplegado en
          namespace '{{ jupyterhub_namespace }}'. Accesible en NodePort {{ jupyterhub_port }}
          y dominio https://{{ jupyterhub_domain }}.
      tags: [update]
