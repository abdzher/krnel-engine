---
# =============================================================================
# KRNEL — playbooks/04-monitoring.yml
# Tarea 7: Despliegue del stack de VictoriaMetrics para monitoreo del clúster.
# Reemplaza prometheus+grafana con una solución de mayor rendimiento.
# =============================================================================

- name: "TAREA 7 | Desplegar VictoriaMetrics K8s Stack"
  hosts: master
  become: false
  vars:
    vm_values_tmp: "/tmp/vm-values-{{ ansible_facts['date_time']['epoch'] }}.yaml"

  tasks:
    - name: Agregar repositorio Helm de VictoriaMetrics
      kubernetes.core.helm_repository:
        kubeconfig: "{{ k8s_kubeconfig }}"
        name: vm
        repo_url: "https://victoriametrics.github.io/helm-charts/"
        state: present
      register: _helm_repo_vm
      # kubernetes.core.helm_repository (6.5.0) no es idempotente: falla con
      # "Repository already have a repository named X" en vez de no-op cuando
      # el repo ya existe. Se tolera ese mensaje puntual; cualquier otro fallo
      # sigue siendo fatal.
      failed_when:
        - _helm_repo_vm is failed
        - "'already have a repository' not in (_helm_repo_vm.msg | default(''))"

    - name: Verificar que smtp_auth_password no es el valor de ejemplo (hallazgo E3)
      ansible.builtin.fail:
        msg: >
          'smtp_auth_password' contiene el valor de ejemplo. Genera una
          contraseña de aplicación en myaccount.google.com/apppasswords (u
          obtén la credencial de tu relay SMTP) y cífrala:
          ansible-vault encrypt_string 'clave' --name smtp_auth_password
      when: smtp_auth_password == "REEMPLAZAR_CON_ANSIBLE_VAULT"

    - name: Renderizar vm-values.yaml desde plantilla Jinja2
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/vm-values.yaml.j2"
        dest: "{{ vm_values_tmp }}"
        mode: "0644"

    - name: Instalar/Actualizar VictoriaMetrics K8s Stack (upgrade --install)
      kubernetes.core.helm:
        kubeconfig: "{{ k8s_kubeconfig }}"
        name: "{{ victoria_metrics_release }}"
        chart_ref: vm/victoria-metrics-k8s-stack
        chart_version: "{{ victoria_metrics_version }}"
        release_namespace: "{{ victoria_metrics_namespace }}"
        create_namespace: true
        values_files:
          - "{{ vm_values_tmp }}"
        update_repo_cache: true
        state: present

    - name: Limpiar archivo temporal de values
      ansible.builtin.file:
        path: "{{ vm_values_tmp }}"
        state: absent

    # -------------------------------------------------------------------------
    # Alertmanager standalone (hallazgo E3) — ver comentario largo en
    # vm-values.yaml.j2 y en mrkov-alertmanager.yaml.j2 sobre por qué NO se usa
    # el Alertmanager integrado del chart (nombre demasiado largo, rompe el
    # límite de 63 bytes de Kubernetes en el StatefulSet).
    # -------------------------------------------------------------------------
    - name: Renderizar VMAlertmanager standalone desde plantilla Jinja2
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/mrkov-alertmanager.yaml.j2"
        dest: "/tmp/mrkov-alertmanager-{{ ansible_facts['date_time']['epoch'] }}.yaml"
        mode: "0600"
      register: alertmanager_tmp

    - name: Aplicar VMAlertmanager standalone
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_kubeconfig }}"
        state: present
        src: "{{ alertmanager_tmp.dest }}"

    - name: Limpiar manifest temporal de VMAlertmanager (contiene credenciales)
      ansible.builtin.file:
        path: "{{ alertmanager_tmp.dest }}"
        state: absent

    - name: Verificar que el pod de Grafana está corriendo
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_kubeconfig }}"
        kind: Deployment
        namespace: "{{ victoria_metrics_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=grafana"
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180
      register: grafana_status
      ignore_errors: true   # No bloquear si Grafana tarda más de lo esperado

    - name: Confirmar despliegue de monitoreo
      ansible.builtin.debug:
        msg: >
          VictoriaMetrics stack '{{ victoria_metrics_release }}' desplegado en
          namespace '{{ victoria_metrics_namespace }}'. Grafana accesible en NodePort {{ victoria_metrics_port }}.
          Alertmanager activo, notificando a {{ alert_admin_emails | length }} administrador(es) por correo.
